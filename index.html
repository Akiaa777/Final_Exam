<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extract Café Inventory System</title>
  <style>
    :root {
      --primary: #4A2C2A;
      --secondary: #8B5A2B;
      --accent: #D4A373;
      --bg-cream: #FAEDCD;
      --glass-bg: rgba(74, 44, 42, 0.45);
      --glass-border: rgba(212, 163, 115, 0.4);
      --text-light: #FFFFFF;
      --text-muted: #EAEAEA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #2C1810 0%, #4A2C2A 50%, #8B5A2B 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Glassmorphism Card (Matches UI Screenshot Layout) */
    .login-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--glass-border);
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      padding: 40px 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      color: var(--text-light);
      text-align: center;
    }

    .login-card h2 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 35px;
      letter-spacing: 0.5px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 25px;
      position: relative;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .input-group input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--glass-border);
      padding: 8px 0;
      color: var(--text-light);
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .input-group input:focus {
      border-bottom-color: var(--accent);
    }

    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 30px;
      color: var(--text-muted);
    }

    .options-row label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .options-row a {
      color: var(--text-light);
      text-decoration: none;
      font-weight: 600;
    }

    .options-row a:hover {
      text-decoration: underline;
    }

    .btn-submit {
      width: 100%;
      background: #FFFFFF;
      color: var(--primary);
      border: none;
      padding: 12px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .btn-submit:hover {
      background: var(--bg-cream);
      transform: translateY(-2px);
    }

    .footer-text {
      margin-top: 25px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .footer-text a {
      color: var(--text-light);
      font-weight: 700;
      text-decoration: none;
      margin-left: 4px;
    }

    #message {
      margin-bottom: 20px;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    .msg-error { background: rgba(230, 57, 70, 0.8); color: white; }
    .msg-success { background: rgba(42, 157, 143, 0.8); color: white; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Login</h2>
    
    <div id="message"></div>

    <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
      <div class="input-group">
        <label for="loginUsername">Email / Username</label>
        <input type="text" id="loginUsername" required autocomplete="username">
      </div>

      <div class="input-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>

      <div class="options-row">
        <label>
          <input type="checkbox" id="rememberMe"> Remember Me
        </label>
        <a href="#">Forgot Password</a>
      </div>

      <button type="submit" class="btn-submit">Log In</button>
    </form>

    <p class="footer-text">
      Don't have an account? <a href="#">Register</a>
    </p>
  </div>

  <script>
    const SPREADSHEET_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzsRbGnukqlreoF3feAAtEjuf927HZE7Nx7uPHM_0oKHKHiopqb6i0YX9EeC96PMBivXw/exec";

    async function handleLogin() {
      const user = document.getElementById("loginUsername").value.trim();
      const pass = document.getElementById("loginPassword").value.trim();

      if (!user || !pass) {
        showMessage("Please fill in both fields.", "msg-error");
        return;
      }

      showMessage("Authenticating...", "msg-success");

      try {
        // Fetch request optimized for Google Apps Script Web App redirects
        const response = await fetch(SPREADSHEET_WEB_APP_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action: "login",
            username: user,
            password: pass
          })
        });

        const res = await response.json();

        if (res.success) {
          showMessage("Login successful! Redirecting...", "msg-success");
          // Save session username
          sessionStorage.setItem("currentUser", res.username);
          
          // Proceed to MFA or Dashboard
          setTimeout(() => {
            alert("Welcome " + res.username + " (" + res.role + ")");
          }, 500);
        } else {
          showMessage(res.message || "Invalid credentials.", "msg-error");
        }
      } catch (err) {
        showMessage("Connection error. Check Google Sheet setup or script permissions.", "msg-error");
        console.error(err);
      }
    }

    function showMessage(msg, typeClass) {
      const msgDiv = document.getElementById("message");
      msgDiv.className = typeClass;
      msgDiv.innerText = msg;
      msgDiv.style.display = "block";
    }
  </script>
</body>
</html>
