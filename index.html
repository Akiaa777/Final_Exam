<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extract Café Inventory System</title>
  <style>
    :root {
      --primary: #4A2C2A;
      --secondary: #8B5A2B;
      --accent: #D4A373;
      --bg-cream: #FAEDCD;
      --glass-bg: rgba(74, 44, 42, 0.45);
      --glass-border: rgba(212, 163, 115, 0.4);
      --text-light: #FFFFFF;
      --text-muted: #EAEAEA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #2C1810 0%, #4A2C2A 50%, #8B5A2B 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-card {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--glass-border);
      border-radius: 20px;
      width: 100%;
      max-width: 380px;
      padding: 40px 30px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      color: var(--text-light);
      text-align: center;
    }

    .login-card h2 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 25px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    .input-group input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--glass-border);
      padding: 8px 0;
      color: var(--text-light);
      font-size: 15px;
      outline: none;
    }

    .input-group input:focus {
      border-bottom-color: var(--accent);
    }

    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 25px;
      color: var(--text-muted);
    }

    .options-row label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .options-row a {
      color: var(--text-light);
      text-decoration: none;
      font-weight: 600;
    }

    .btn-submit {
      width: 100%;
      background: #FFFFFF;
      color: var(--primary);
      border: none;
      padding: 12px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-submit:hover {
      background: var(--bg-cream);
    }

    .footer-text {
      margin-top: 25px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .footer-text a {
      color: var(--text-light);
      font-weight: 700;
      text-decoration: none;
      margin-left: 4px;
      cursor: pointer;
    }

    #message {
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    .msg-error { background: rgba(230, 57, 70, 0.85); color: white; }
    .msg-success { background: rgba(42, 157, 143, 0.85); color: white; }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="login-card">
    <div id="message"></div>

    <!-- LOGIN FORM -->
    <div id="loginSection">
      <h2>Login</h2>
      <form onsubmit="event.preventDefault(); handleAuth('login');">
        <div class="input-group">
          <label for="loginUsername">Email / Username</label>
          <input type="text" id="loginUsername" required autocomplete="username">
        </div>

        <div class="input-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" required autocomplete="current-password">
        </div>

        <div class="options-row">
          <label><input type="checkbox" id="rememberMe"> Remember Me</label>
          <a href="#">Forgot Password</a>
        </div>

        <button type="submit" class="btn-submit">Log In</button>
      </form>

      <p class="footer-text">
        Don't have an account? <a onclick="toggleForm('register')">Register</a>
      </p>
    </div>

    <!-- REGISTER FORM -->
    <div id="registerSection" class="hidden">
      <h2>Register</h2>
      <form onsubmit="event.preventDefault(); handleAuth('register');">
        <div class="input-group">
          <label for="regUsername">Email / Username</label>
          <input type="text" id="regUsername" required>
        </div>

        <div class="input-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" required>
        </div>

        <button type="submit" class="btn-submit" style="margin-top: 10px;">Create Account</button>
      </form>

      <p class="footer-text">
        Already have an account? <a onclick="toggleForm('login')">Login</a>
      </p>
    </div>
  </div>

  <script>
    // NEW DEPLOYED APPS SCRIPT WEB APP URL
    const SPREADSHEET_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxAFs1s6jTePxIpV4TXK5RKvJzu_wg5GidtDqK45kTpIMvN9muWdw5JpQZMPyiqyDg2Jg/exec";

    function toggleForm(type) {
      document.getElementById("message").style.display = "none";
      if (type === 'register') {
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("registerSection").classList.remove("hidden");
      } else {
        document.getElementById("registerSection").classList.add("hidden");
        document.getElementById("loginSection").classList.remove("hidden");
      }
    }

    async function handleAuth(actionType) {
      const isLogin = actionType === 'login';
      const usernameInput = isLogin ? "loginUsername" : "regUsername";
      const passwordInput = isLogin ? "loginPassword" : "regPassword";

      const user = document.getElementById(usernameInput).value.trim();
      const pass = document.getElementById(passwordInput).value.trim();

      if (!user || !pass) {
        showMessage("Please fill in all fields.", "msg-error");
        return;
      }

      showMessage("Connecting...", "msg-success");

      try {
        const response = await fetch(SPREADSHEET_WEB_APP_URL, {
          method: "POST",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action: actionType,
            username: user,
            password: pass
          })
        });

        const res = await response.json();

        if (res.success) {
          showMessage(res.message || "Success!", "msg-success");
          if (isLogin) {
            sessionStorage.setItem("currentUser", res.username);
            setTimeout(() => {
              alert("Login successful! Welcome " + res.username);
            }, 500);
          } else {
            setTimeout(() => toggleForm('login'), 1500);
          }
        } else {
          showMessage(res.message || "Operation failed.", "msg-error");
        }
      } catch (err) {
        showMessage("Connection error. Check script permissions (Who has access -> Anyone).", "msg-error");
        console.error(err);
      }
    }

    function showMessage(msg, typeClass) {
      const msgDiv = document.getElementById("message");
      msgDiv.className = typeClass;
      msgDiv.innerText = msg;
      msgDiv.style.display = "block";
    }
  </script>
</body>
</html>
