<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
  <title>BREW HAUS - Cafe Inventory System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #1c1412; color: #f4eee1; min-height: 100vh; display: flex; flex-direction: column; }

    .login-card {
      max-width: 400px;
      width: 90%;
      margin: 80px auto;
      padding: 30px;
      background-color: #2c211e;
      border-radius: 12px;
      border: 1px solid #483833;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .form-group { margin-bottom: 20px; text-align: left; }
    .form-group input { width: 100%; padding: 12px; padding-right: 70px; }

    .btn-primary { width: 100%; padding: 12px; background: #d4a373; color: #2c211e; border: none; font-weight: 700; cursor: pointer; border-radius: 8px; font-size: 14px; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    header { background: #231916; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #483833; }
    .brand { font-size: 18px; font-weight: 800; color: #d4a373; display: flex; align-items: center; gap: 8px; }
    
    .nav-bar { display: flex; background: #231916; overflow-x: auto; border-bottom: 2px solid #483833; white-space: nowrap; -webkit-overflow-scrolling: touch; }
    .nav-btn { background: none; border: none; color: #b08968; padding: 12px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .nav-btn.active { color: #d4a373; border-bottom: 3px solid #d4a373; }

    .container { padding: 16px; flex: 1; max-width: 800px; margin: 0 auto; width: 100%; }
    .card { background: #2c211e; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #483833; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }

    label { font-size: 11px; font-weight: 700; color: #b08968; text-transform: uppercase; margin-top: 8px; display: block; }
    input, select, button { width: 100%; padding: 12px; margin-top: 4px; border-radius: 8px; border: 1px solid #483833; background: #1c1412; color: #fff; font-size: 14px; }
    button.btn-amber { background: #d4a373; color: #2c211e; border: none; font-weight: 700; cursor: pointer; margin-top: 12px; }
    button.btn-danger { background: #bc6c25; color: #fff; border: none; font-weight: 700; cursor: pointer; padding: 6px 12px; width: auto; font-size: 12px; border-radius: 6px; }

    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
    .metric-box { background: #1c1412; padding: 12px; border-radius: 8px; border: 1px solid #483833; }
    .metric-val { font-size: 20px; font-weight: 800; color: #d4a373; margin-top: 4px; }

    .table-responsive { overflow-x: auto; margin-top: 12px; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th { background: #1c1412; color: #d4a373; padding: 10px; border-bottom: 1px solid #483833; }
    td { padding: 10px; border-bottom: 1px solid #483833; color: #e3d5ca; }

    .otp-input-box { text-align: center; font-size: 22px; letter-spacing: 8px; font-weight: bold; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- LOGIN SECTION -->
  <div id="loginSection" class="login-card">
    <h2 style="color: #d4a373; margin-bottom: 20px; text-align: center;">☕ BREW HAUS</h2>
    
    <!-- STEP 1: CREDENTIALS -->
    <div id="stepCredentials">
      <div class="form-group">
        <label>USERNAME</label>
        <input type="text" id="loginUsername" placeholder="Enter username">
      </div>
      <div class="form-group" style="position: relative;">
        <label>PASSWORD</label>
        <input type="password" id="loginPassword" placeholder="Enter password">
        <span id="showToggleBtn" onclick="togglePasswordVisibility(event)" style="position: absolute; right: 12px; top: 38px; cursor: pointer; font-size: 13px; color: #b08968;">👁️ Show</span>
      </div>
      <div style="text-align: right; margin-bottom: 15px;">
        <a href="#" onclick="handleForgotPassword(event)" style="color: #d4a373; font-size: 13px; text-decoration: none;">Forgot Password?</a>
      </div>
      <button id="loginBtn" class="btn-primary" onclick="handleRequestOtp()">SEND OTP</button>
    </div>

    <!-- STEP 2: OTP VERIFICATION -->
    <div id="stepOtp" class="hidden">
      <p id="otpNotice" style="font-size: 13px; color: #e3d5ca; margin-bottom: 15px; text-align: center;"></p>
      <div class="form-group">
        <label>ENTER 6-DIGIT OTP</label>
        <input type="text" id="otpCode" class="otp-input-box" maxlength="6" placeholder="123456">
      </div>
      <button id="verifyBtn" class="btn-primary" onclick="handleVerifyOtp()">VERIFY & LOG IN</button>
      <button style="background: none; border: none; color: #b08968; font-size: 12px; cursor: pointer; margin-top: 10px;" onclick="resetToStep1()">← Back to Login</button>
    </div>

    <p id="loginError" style="color: #bc6c25; font-size: 12px; margin-top: 12px; text-align: center; display: none;"></p>
  </div>

  <!-- MAIN APP SECTION -->
  <div id="appView" class="hidden">
    <header>
      <div class="brand">☕ BREW HAUS</div>
      <div style="display:flex; align-items:center; gap:10px;">
        <span id="userBadge" style="font-size: 12px; color: #e3d5ca;">-</span>
        <button class="btn-danger" onclick="logout()">Logout</button>
      </div>
    </header>

    <div class="nav-bar">
      <button class="nav-btn active" onclick="switchTab('dashboard')">Dashboard</button>
      <button class="nav-btn" onclick="switchTab('catalog')">Catalog</button>
      <button class="nav-btn" onclick="switchTab('addStock')">+ Add New Item</button>
      <button class="nav-btn" onclick="switchTab('stock')">Stock In/Out</button>
      <button class="nav-btn" onclick="switchTab('suppliers')">Suppliers</button>
      <button class="nav-btn" onclick="switchTab('alerts')">Low Stock</button>
      <button class="nav-btn" onclick="switchTab('logs')">Audit Logs</button>
      <button class="nav-btn" onclick="switchTab('users')">Users</button>
    </div>

    <div class="container">
      <!-- 1. DASHBOARD -->
      <div id="tab-dashboard" class="tab-content card">
        <h3 style="margin-bottom:12px; color:#d4a373;">Cafe Dashboard</h3>
        <div class="grid-3">
          <div class="metric-box"><div style="font-size:10px; color:#b08968;">ITEMS</div><div class="metric-val" id="m-items">0</div></div>
          <div class="metric-box"><div style="font-size:10px; color:#b08968;">VALUATION</div><div class="metric-val" id="m-val">₱0</div></div>
          <div class="metric-box"><div style="font-size:10px; color:#b08968;">LOW STOCK</div><div class="metric-val" id="m-low" style="color:#bc6c25;">0</div></div>
        </div>
      </div>

      <!-- 2. CATALOG -->
      <div id="tab-catalog" class="tab-content card hidden">
        <h3 style="color:#d4a373;">Supply Catalog</h3>
        <div id="catalogTable" class="table-responsive">Loading...</div>
      </div>

      <!-- 3. ADD NEW ITEM -->
      <div id="tab-addStock" class="tab-content card hidden">
        <h3 style="color:#d4a373; margin-bottom:8px;">Add New Supply Item</h3>
        <label>Item ID</label>
        <input type="text" id="addId" placeholder="e.g. COF-001">
        <label>Item Name</label>
        <input type="text" id="addName" placeholder="e.g. Arabica Beans (1kg)">
        <label>Category</label>
        <input type="text" id="addCategory" placeholder="e.g. Beans / Dairy / Syrups">
        <label>Initial Quantity</label>
        <input type="number" id="addQty" placeholder="0">
        <label>Unit Price (₱)</label>
        <input type="number" id="addPrice" placeholder="0.00">
        <label>Min Stock Alert Level</label>
        <input type="number" id="addMin" placeholder="5">
        <button class="btn-amber" onclick="submitNewItem()">Save New Item</button>
      </div>

      <!-- 4. STOCK IN/OUT -->
      <div id="tab-stock" class="tab-content card hidden">
        <h3 style="color:#d4a373; margin-bottom:8px;">Stock Adjustment</h3>
        <label>Item ID</label>
        <input type="text" id="stkId" placeholder="e.g. COF-001">
        <label>Movement Type</label>
        <select id="stkType"><option value="STOCK IN">Stock IN (+)</option><option value="STOCK OUT">Stock OUT (-)</option></select>
        <label>Quantity</label>
        <input type="number" id="stkQty" placeholder="0">
        <label>Notes / Reason</label>
        <input type="text" id="stkNotes" placeholder="e.g. Weekly delivery, Spilled milk batch">
        <button class="btn-amber" onclick="submitStock()">Submit Stock Transaction</button>
      </div>

      <!-- 5. SUPPLIERS -->
      <div id="tab-suppliers" class="tab-content card hidden">
        <h3 style="color:#d4a373;">Supplier Contacts</h3>
        <div id="supplierTable" class="table-responsive">Loading...</div>
      </div>

      <!-- 6. LOW STOCK ALERTS -->
      <div id="tab-alerts" class="tab-content card hidden">
        <h3 style="color:#bc6c25;">Low Stock Alerts</h3>
        <div id="alertsTable" class="table-responsive">Loading...</div>
      </div>

      <!-- 7. AUDIT LOGS -->
      <div id="tab-logs" class="tab-content card hidden">
        <h3 style="color:#d4a373;">Transaction Audit Trail</h3>
        <div id="logsTable" class="table-responsive">Loading...</div>
      </div>

      <!-- 8. USER MANAGEMENT -->
      <div id="tab-users" class="tab-content card hidden">
        <h3 style="color:#d4a373;">System Users</h3>
        <div id="usersTable" class="table-responsive">Loading...</div>
      </div>
    </div>
  </div>

  <script>
    // Connected to your deployed Google Apps Script backend
    const API_URL = "https://script.google.com/macros/s/AKfycbx1e9zw-H6lmDmIHI9vfE17d0APmUd9jX2ksQk6cwNnq_-EZmcqL9dpQpw8R3lj2fWwrw/exec";
    
    let sessionToken = sessionStorage.getItem("sessionToken");
    let currentUserRole = sessionStorage.getItem("userRole");
    let currentUsername = sessionStorage.getItem("userName");
    let pendingUsername = "";

    window.addEventListener("DOMContentLoaded", () => {
      if (sessionToken && currentUserRole && currentUsername) {
        showAppView(currentUsername, currentUserRole);
      }
    });

    function togglePasswordVisibility(e) {
      if (e) e.preventDefault();
      const passwordInput = document.getElementById("loginPassword");
      const toggleBtn = document.getElementById("showToggleBtn");
      passwordInput.type = passwordInput.type === "password" ? "text" : "password";
      toggleBtn.textContent = passwordInput.type === "password" ? "👁️ Show" : "🙈 Hide";
    }

    function handleForgotPassword(e) {
      if (e) e.preventDefault();
      alert("Forgot Password?\n\nPlease contact your Cafe Administrator to reset your credentials.");
    }

    function apiCall(payload, callback) {
      if (sessionToken) payload.token = sessionToken;
      fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if (!data.success && (data.message === "Unauthorized or session expired." || data.message === "Access denied.")) {
          alert("Session Expired or Unauthorized Access: " + data.message);
          logout();
          return;
        }
        callback(data);
      })
      .catch(err => alert("Connection error. Ensure your APPS SCRIPT URL is correct."));
    }

    // OTP STEP 1: Request OTP
    function handleRequestOtp() {
      const u = document.getElementById("loginUsername").value.trim();
      const p = document.getElementById("loginPassword").value.trim();
      const btn = document.getElementById("loginBtn");
      const err = document.getElementById("loginError");

      if (!u || !p) {
        err.innerText = "Please enter both username and password.";
        err.style.display = "block";
        return;
      }

      btn.innerText = "Sending Code...";
      btn.disabled = true;
      err.style.display = "none";

      apiCall({ action: "requestOtp", username: u, password: p }, res => {
        btn.innerText = "SEND OTP";
        btn.disabled = false;
        if (res.success) {
          pendingUsername = res.username;
          document.getElementById("stepCredentials").classList.add("hidden");
          document.getElementById("stepOtp").classList.remove("hidden");
          document.getElementById("otpNotice").innerText = res.message;
        } else {
          err.innerText = res.message;
          err.style.display = "block";
        }
      });
    }

    // OTP STEP 2: Verify OTP Code
    function handleVerifyOtp() {
      const otp = document.getElementById("otpCode").value.trim();
      const btn = document.getElementById("verifyBtn");
      const err = document.getElementById("loginError");

      if (!otp || otp.length !== 6) {
        err.innerText = "Please enter a valid 6-digit OTP code.";
        err.style.display = "block";
        return;
      }

      btn.innerText = "Verifying...";
      btn.disabled = true;
      err.style.display = "none";

      apiCall({ action: "verifyOtp", username: pendingUsername, otp: otp }, res => {
        btn.innerText = "VERIFY & LOG IN";
        btn.disabled = false;
        if (res.success) {
          sessionToken = res.token;
          currentUserRole = res.role;
          currentUsername = res.username;

          sessionStorage.setItem("sessionToken", sessionToken);
          sessionStorage.setItem("userRole", currentUserRole);
          sessionStorage.setItem("userName", currentUsername);

          showAppView(currentUsername, currentUserRole);
        } else {
          err.innerText = res.message;
          err.style.display = "block";
        }
      });
    }

    function resetToStep1() {
      document.getElementById("stepOtp").classList.add("hidden");
      document.getElementById("stepCredentials").classList.remove("hidden");
      document.getElementById("loginError").style.display = "none";
      document.getElementById("otpCode").value = "";
    }

    function showAppView(username, role) {
      document.getElementById("userBadge").innerText = `${username} (${role})`;
      document.getElementById("loginSection").classList.add("hidden");
      document.getElementById("appView").classList.remove("hidden");

      const userTabBtn = document.querySelector("button[onclick=\"switchTab('users')\"]");
      if (userTabBtn) userTabBtn.style.display = role.toLowerCase() === "admin" ? "inline-block" : "none";

      switchTab("dashboard");
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      
      const activeBtn = document.querySelector(`.nav-btn[onclick="switchTab('${tabName}')"]`);
      if (activeBtn) activeBtn.classList.add('active');

      document.getElementById('tab-' + tabName).classList.remove('hidden');

      if (tabName === 'dashboard') loadDashboard();
      if (tabName === 'catalog') loadCatalog();
      if (tabName === 'suppliers') loadSuppliers();
      if (tabName === 'alerts') loadLowStock();
      if (tabName === 'logs') loadLogs();
      if (tabName === 'users') loadUsers();
    }

    function renderCatalogTable(rawMatrix) {
      if (!rawMatrix || rawMatrix.length === 0) return "<p>No data available.</p>";
      let html = "<table><tr>";
      rawMatrix[0].forEach(h => html += `<th>${h}</th>`);
      html += "<th>ACTION</th></tr>";

      for (let i = 1; i < rawMatrix.length; i++) {
        html += "<tr>";
        const itemId = rawMatrix[i][0];
        rawMatrix[i].forEach(cell => html += `<td>${cell}</td>`);
        html += `<td><button class="btn-danger" onclick="deleteItem('${itemId}')">Delete</button></td>`;
        html += "</tr>";
      }
      return html + "</table>";
    }

    function renderTable(rawMatrix) {
      if (!rawMatrix || rawMatrix.length === 0) return "<p>No data available.</p>";
      let html = "<table><tr>";
      rawMatrix[0].forEach(h => html += `<th>${h}</th>`);
      html += "</tr>";
      for (let i = 1; i < rawMatrix.length; i++) {
        html += "<tr>";
        rawMatrix[i].forEach(cell => html += `<td>${cell}</td>`);
        html += "</tr>";
      }
      return html + "</table>";
    }

    function loadDashboard() {
      apiCall({ action: "getDashboard" }, res => {
        if (res.success) {
          document.getElementById("m-items").innerText = res.totalItems;
          document.getElementById("m-val").innerText = "₱" + res.totalValue;
          document.getElementById("m-low").innerText = res.lowStock;
        }
      });
    }

    function loadCatalog() { apiCall({ action: "getInventory" }, res => document.getElementById("catalogTable").innerHTML = renderCatalogTable(res.data)); }
    function loadSuppliers() { apiCall({ action: "getSuppliers" }, res => document.getElementById("supplierTable").innerHTML = renderTable(res.data)); }
    function loadLowStock() { apiCall({ action: "getLowStock" }, res => document.getElementById("alertsTable").innerHTML = renderTable(res.data)); }
    function loadLogs() { apiCall({ action: "getTransactions" }, res => document.getElementById("logsTable").innerHTML = renderTable(res.data)); }
    function loadUsers() { apiCall({ action: "getUsers" }, res => document.getElementById("usersTable").innerHTML = renderTable(res.data)); }

    function submitNewItem() {
      const id = document.getElementById("addId").value.trim();
      const name = document.getElementById("addName").value.trim();
      const cat = document.getElementById("addCategory").value.trim();
      const qty = parseInt(document.getElementById("addQty").value);
      const price = parseFloat(document.getElementById("addPrice").value);
      const min = parseInt(document.getElementById("addMin").value);

      if (!id || !name || isNaN(qty) || isNaN(price)) return alert("Please fill in all item fields correctly.");

      apiCall({ action: "addItem", itemId: id, itemName: name, category: cat, qty: qty, price: price, minStock: min }, res => {
        alert(res.success ? "Item added successfully!" : "Error: " + res.message);
        if (res.success) {
          document.getElementById("addId").value = "";
          document.getElementById("addName").value = "";
          document.getElementById("addCategory").value = "";
          document.getElementById("addQty").value = "";
          document.getElementById("addPrice").value = "";
          document.getElementById("addMin").value = "";
          switchTab('catalog');
        }
      });
    }

    function deleteItem(itemId) {
      if (!confirm(`Are you sure you want to delete Item ID: ${itemId}?`)) return;
      apiCall({ action: "deleteItem", itemId: itemId }, res => {
        alert(res.success ? "Item deleted successfully!" : "Error: " + res.message);
        if (res.success) loadCatalog();
      });
    }

    function submitStock() {
      const itemId = document.getElementById("stkId").value.trim();
      const type = document.getElementById("stkType").value;
      let qty = parseInt(document.getElementById("stkQty").value);
      const notes = document.getElementById("stkNotes").value.trim();

      if (!itemId || isNaN(qty) || qty <= 0) return alert("Please enter valid item ID and positive quantity.");
      if (type === "STOCK OUT") qty = -qty;

      apiCall({ action: "adjustStock", itemId: itemId, qtyChange: qty, type: type, notes: notes }, res => {
        alert(res.success ? "Stock transaction successful!" : "Error: " + res.message);
        if (res.success) {
          document.getElementById("stkId").value = "";
          document.getElementById("stkQty").value = "";
          document.getElementById("stkNotes").value = "";
          switchTab('catalog');
        }
      });
    }

    function logout() {
      sessionToken = null;
      currentUserRole = null;
      currentUsername = null;
      pendingUsername = "";
      sessionStorage.clear();

      resetToStep1();
      document.getElementById("appView").classList.add("hidden");
      document.getElementById("loginSection").classList.remove("hidden");
    }
  </script>
</body>
</html>
